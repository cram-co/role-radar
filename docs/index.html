<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cram Limited</title>
<meta name="description" content="Cram Limited — independent consulting across iGaming, fintech, regtech and compliance." />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root{--ink:#0A0C10;--navy:#0E1B2E;--navy2:#16283F;--steel:#3E5069;--slate:#6B7688;
        --mist:#AEB6C2;--paper:#F4F5F7;--line2:#E2E4E8;--royal:#1F4BC4;--chief:#5B8DEF;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--paper);
       -webkit-font-smoothing:antialiased;line-height:1.5;min-height:100vh;
       display:flex;flex-direction:column;}

  .top{padding:38px 24px 0;text-align:center;}
  .top .logo svg{height:38px;width:auto;}
  .top .tag{margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;
            letter-spacing:.18em;text-transform:uppercase;color:var(--slate);}

  main{flex:1;display:flex;align-items:center;justify-content:center;padding:44px 24px;}
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:26px;
         width:100%;max-width:820px;}

  .card{display:flex;flex-direction:column;align-items:center;text-align:center;
        background:#fff;border:1px solid var(--line2);border-radius:16px;
        padding:38px 30px 32px;transition:.18s;}
  .card:hover{border-color:var(--steel);box-shadow:0 10px 30px rgba(14,27,46,.08);
              transform:translateY(-2px);}

  .card img{width:132px;height:132px;border-radius:50%;
            box-shadow:0 0 0 1px var(--line2), 0 8px 20px rgba(14,27,46,.10);}
  .card h2{font-family:'Fraunces',serif;font-weight:500;font-size:25px;color:var(--navy);
           margin-top:22px;letter-spacing:-.01em;}
  .card .role{margin-top:9px;font-size:15px;color:var(--steel);line-height:1.5;}
  .card .sectors{margin-top:7px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;
                 letter-spacing:.12em;text-transform:uppercase;color:var(--slate);}

  .enter{margin-top:26px;display:inline-block;background:var(--navy);color:#fff;
         text-decoration:none;padding:12px 34px;border-radius:6px;font-size:14.5px;
         font-weight:600;letter-spacing:.02em;transition:.15s;}
  .enter:hover{background:var(--royal);}
  .enter.soon{background:transparent;color:var(--slate);
              box-shadow:inset 0 0 0 1px var(--line2);font-weight:500;}
  .enter.soon:hover{background:transparent;color:var(--steel);
                    box-shadow:inset 0 0 0 1px var(--steel);}

  footer{padding:0 24px 34px;text-align:center;
         font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--slate);}

  @media(max-width:720px){
    .cards{grid-template-columns:1fr;gap:20px;max-width:400px;}
    .card{padding:32px 26px 28px;}
    .card img{width:112px;height:112px;}
    main{padding:32px 20px;}
  }
</style>
</head>

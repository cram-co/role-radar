<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Erin Cram | Cram Limited</title>
<meta name="robots" content="noindex" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root{--ink:#0A0C10;--navy:#0E1B2E;--steel:#3E5069;--slate:#6B7688;--mist:#AEB6C2;
        --paper:#F4F5F7;--line2:#E2E4E8;--royal:#1F4BC4;--chief:#5B8DEF;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--paper);
       -webkit-font-smoothing:antialiased;line-height:1.5;min-height:100vh;
       display:flex;flex-direction:column;}
  .top{padding:38px 24px 0;text-align:center;}
  .top svg{height:38px;width:auto;}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:44px 24px;}
  .panel{text-align:center;max-width:460px;}
  .panel img{width:150px;height:150px;border-radius:50%;
             box-shadow:0 0 0 1px var(--line2), 0 8px 24px rgba(14,27,46,.10);}
  .panel h1{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(28px,5vw,38px);
            color:var(--navy);margin-top:26px;letter-spacing:-.01em;}
  .panel .role{margin-top:11px;font-size:16.5px;color:var(--steel);}
  .panel .sectors{margin-top:8px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;
                  letter-spacing:.14em;text-transform:uppercase;color:var(--slate);}
  .soon{margin-top:32px;display:inline-block;padding:11px 26px;border-radius:100px;
        background:var(--navy);color:#fff;font-family:'IBM Plex Mono',monospace;
        font-size:12px;letter-spacing:.2em;text-transform:uppercase;}
  .links{margin-top:30px;display:flex;gap:22px;justify-content:center;flex-wrap:wrap;}
  .links a{color:var(--royal);text-decoration:none;font-size:14.5px;}
  .links a:hover{text-decoration:underline;}
  footer{padding:0 24px 34px;text-align:center;
         font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--slate);}
  footer a{color:var(--slate);text-decoration:none;}
  footer a:hover{color:var(--steel);}
</style>
</head>

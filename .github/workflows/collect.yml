name: collect

on:
  schedule:
    - cron: "0 6 * * *"   # daily, 06:00 UTC
  workflow_dispatch:        # allows manual "Run workflow" button

permissions:
  contents: write

# A run takes ~16 minutes. Without this, a manual run and the scheduled one can
# overlap: the second checks out an older commit, works for a quarter of an
# hour, then has its push rejected as non-fast-forward. Queue them instead.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run collector
        run: python collector.py

      # if: always() makes this run even when the collector crashes. The
      # collector writes docs/run-log.txt in a finally block, so the log
      # survives a failure — but without this the commit is skipped and the
      # diagnostics die with the runner, which is exactly when they matter.
      #
      # The retry is the belt to concurrency's braces: if anything has landed
      # on main while we were collecting — a file edited in the web UI, say —
      # rebase onto it and try again rather than losing the whole run.
      - name: Commit updated feed
        if: always()
        run: |
          git config user.name "role-radar-bot"
          git config user.email "actions@github.com"
          git add docs/ companies.csv
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Daily feed update"
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing onto the remote and retrying"
            git pull --rebase origin main || true
            sleep 5
          done
          echo "could not push after 3 attempts"
          exit 1
